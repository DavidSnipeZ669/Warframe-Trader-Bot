<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';">
  <title>Warframe Trader Bot</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-left">
        <h1>🎮 Warframe Trader Bot</h1>
      </div>
      <div class="header-right">
        <div class="bot-status">
          <span id="status-indicator" class="status-indicator offline"></span>
          <span id="status-text">Stopped</span>
        </div>
        <button id="toggle-bot" class="btn btn-primary">Start Bot</button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Sidebar - Add Items -->
      <aside class="sidebar">
        <div class="panel">
          <h2>➕ Add Item</h2>
          <div class="search-container">
            <input type="text" id="search-input" placeholder="Search items..." class="input-field">
            <div id="search-results" class="search-results hidden"></div>
          </div>
          
          <div id="add-item-form" class="add-item-form hidden">
            <h3 id="selected-item-name">Selected Item</h3>
            <input type="hidden" id="selected-item-url">
            
            <div class="form-group">
              <label for="item-quantity">Quantity</label>
              <div class="quantity-control">
                <button type="button" class="qty-btn" id="qty-decrease">−</button>
                <input type="number" id="item-quantity" value="1" min="1" max="100" class="input-field qty-input">
                <button type="button" class="qty-btn" id="qty-increase">+</button>
              </div>
            </div>
            
            <div class="form-group">
              <label for="min-sell-price">Min Sell Price (p)</label>
              <input type="number" id="min-sell-price" placeholder="Optional" min="1" class="input-field">
            </div>
            
            <div class="form-group">
              <label for="max-buy-price">Max Buy Price (p)</label>
              <input type="number" id="max-buy-price" placeholder="Optional" min="1" class="input-field">
            </div>
            
            <div class="form-group">
              <label class="checkbox-label">
                <input type="checkbox" id="auto-list-checkbox" checked>
                <span>Auto-list this item</span>
              </label>
            </div>
            
            <button type="button" id="add-item-btn" class="btn btn-success btn-full">Add to Inventory</button>
          </div>
        </div>
        
        <div class="panel">
          <h2>⚙️ Settings</h2>
          <div class="form-group">
            <label for="global-auto-list">Default Auto-List Quantity</label>
            <input type="number" id="global-auto-list" value="1" min="1" max="100" class="input-field">
          </div>
        </div>
      </aside>

      <!-- Inventory List -->
      <section class="inventory-section">
        <div class="inventory-header">
          <h2>📦 Inventory</h2>
          <div class="inventory-stats">
            <span id="total-items">0 items</span>
            <span id="auto-listed">0 auto-listed</span>
          </div>
        </div>
        
        <div id="inventory-list" class="inventory-list">
          <div class="empty-state">
            <p>No items in inventory</p>
            <p class="hint">Search and add items using the panel on the left</p>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <p>Warframe Trader Bot v1.0.0 | Market data from warframe.market</p>
    </footer>
  </div>

  <!-- Item Card Template -->
  <template id="item-card-template">
    <div class="item-card" data-url-name="">
      <div class="item-header">
        <h3 class="item-name"></h3>
        <div class="item-actions">
          <button class="btn btn-icon btn-analyze" title="Analyze prices">📊</button>
          <button class="btn btn-icon btn-remove" title="Remove item">🗑️</button>
        </div>
      </div>
      
      <div class="item-controls">
        <div class="control-group">
          <label>Quantity</label>
          <div class="quantity-control">
            <button type="button" class="qty-btn qty-dec">−</button>
            <input type="number" class="input-field qty-input item-quantity" value="1" min="1" max="100">
            <button type="button" class="qty-btn qty-inc">+</button>
          </div>
        </div>
        
        <div class="control-group">
          <label>Min Sell</label>
          <input type="number" class="input-field price-input min-sell" placeholder="—" min="1">
        </div>
        
        <div class="control-group">
          <label>Max Buy</label>
          <input type="number" class="input-field price-input max-buy" placeholder="—" min="1">
        </div>
        
        <div class="control-group toggle-group">
          <label>Auto-List</label>
          <label class="toggle">
            <input type="checkbox" class="auto-list-toggle">
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>
      
      <div class="item-prices hidden">
        <span class="price-label">Market:</span>
        <span class="lowest-sell">—</span>
        <span class="price-separator">/</span>
        <span class="highest-buy">—</span>
      </div>
    </div>
  </template>

  <script src="renderer.js"></script>
</body>
</html>
